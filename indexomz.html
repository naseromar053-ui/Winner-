<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>اكسب 3000 جنيه مجاناً!</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f4f4f4; padding: 20px; }
        .box { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .btn { background: #25D366; color: white; padding: 15px 20px; border: none; border-radius: 5px; font-size: 18px; cursor: pointer; text-decoration: none; display: inline-block; margin-top: 20px;}
    </style>
</head>
<body>

    <div class="box">
        <h2>مبروك! لقد سحبت هدية 3,000 جنيه بمناسبة الاحتفال!</h2>
        <p>للحصول على الهدية، يجب عليك مشاركة الرابط مع 5 مجموعات على واتساب أولاً.</p>
        
        <!-- زر المشاركة الإجباري -->
        <a id="shareBtn" class="btn" href="#" onclick="shareWhatsApp()">اضغط هنا للمشاركة واستلام الجائزة</a>
        
        <p id="status" style="color: red; margin-top: 15px;"></p>
    </div>

    <script>
        let sharedCount = 0;

        function shareWhatsApp() {
            // رسالة الواتساب الجاهزة اللي هتروح للضحايا التانيين
            let message = "انا كسبت 3000 جنيه من الموقع ده جرب كده يمكن تكسب زيدي: https://cmkqo.buzz";
            let whatsappUrl = "https://api.whatsapp.com/send?text=" + encodeURIComponent(message);
            
            // بيفتح الواتساب عشان المستخدم يشارك الرابط
            window.open(whatsappUrl, '_blank');
            
            // عداد وهمي عشان يوهم الضحية إنه قرب يخلص
            sharedCount++;
            if(sharedCount < 3) {
                document.getElementById("status").innerText = "خطوة كمان! باقي " + (3 - sharedCount) + " مشاركات لتفعيل الجائزة.";
            } else {
                document.getElementById("status").style.color = "green";
                document.getElementById("status").innerText = "جاري تحويلك لصفحة تسجيل البيانات (الوهمية)...";
            }
        }
    </script>

</body>
</html>
